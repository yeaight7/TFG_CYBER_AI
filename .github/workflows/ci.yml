name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Check Canonical Schema Dimension
        run: |
          uv run python -c "from src.canonical_schema import FEATURES_CANON; assert len(FEATURES_CANON) == 76, 'Invalid schema length'"

      - name: Run Tests
        run: uv run pytest tests/

      - name: Run Ruff (Linting)
        run: uv run ruff check .