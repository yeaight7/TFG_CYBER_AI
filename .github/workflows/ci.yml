name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Pin the interpreter uv uses to match MAIN training (environment.json: 3.12.3).
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          # Cache the uv download/build store across runs (the cu130 torch wheel
          # is ~2.5 GB; caching avoids re-downloading it every run).
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check Canonical Schema Dimension
        run: |
          uv run python -c "from src.canonical_schema import FEATURES_CANON; assert len(FEATURES_CANON) == 76, 'Invalid schema length'"

      - name: Run Tests
        run: uv run pytest tests/

      - name: Run Ruff (Linting)
        run: uv run ruff check .