[project]
name = "tfg-cyber-ai"
version = "0.1.0"
description = "RL-based IDS defensive decision-making prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "gymnasium==1.2.3",
    "stable-baselines3[extra]==2.8.0",
    "sb3-contrib==2.8.0",
    "torch==2.12.0",
    "joblib==1.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.12",
    "graphifyy==0.7.0"
]
# Optional: hyperparameter tuning (src/tune_hparams.py). Installed by CI via `uv sync --all-extras`.
tune = [
    "optuna==4.9.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
