[project]
name = "tfg-cyber-ai"
version = "0.1.0"
description = "RL-based IDS defensive decision-making prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "gymnasium==1.2.3",
    "stable-baselines3[extra]==2.8.0",
    "sb3-contrib==2.8.0",
    "torch==2.12.1",
    "joblib==1.5.3",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.12",
]
# Optional: hyperparameter tuning (src/tune_hparams.py). Installed by CI via `uv sync --all-extras`.
tune = [
    "optuna==4.9.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
# Explicit so lint/format behaviour is reproducible across ruff releases
# (ruff's implicit defaults can change between versions). Current repo is
# clean under this configuration (`ruff check .`).
line-length = 100

[tool.ruff.lint]
# Pin ruff's default stable rule set explicitly: pyflakes (F) + a curated
# subset of pycodestyle errors (E4 imports, E7 statements, E9 syntax).
select = ["E4", "E7", "E9", "F"]
