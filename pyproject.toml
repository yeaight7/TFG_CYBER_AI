[project]
name = "tfg-cyber-ai"
version = "0.1.0"
description = "RL-based IDS defensive decision-making prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "gymnasium>=0.28.0",
    "stable-baselines3[extra]>=2.0.0",
    "sb3-contrib>=2.0.0",
    "torch>=2.0.0",
    "joblib>=1.3.0",
    "kagglehub>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "graphifyy>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
